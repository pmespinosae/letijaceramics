name: Regenerar catálogo

# Se ejecuta automáticamente cada vez que productos.json cambia, o se
# suben fotos nuevas, en main. Genera las versiones .webp que falten,
# corre build.js, y sube todo regenerado — sin intervención humana.

on:
  push:
    branches: [main]
    paths:
      - 'productos.json'
      - '*.png'
      - '*.jpg'
      - '*.jpeg'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Pillow
        run: pip install Pillow

      - name: Generar imágenes WebP faltantes
        run: python convert_images_to_webp.py

      - name: Regenerar index.html
        run: node build.js

      - name: Subir cambios si los hay
        run: |
          git config user.name "Catálogo automático"
          git config user.email "actions@github.com"
          git add index.html "*.webp"
          if git diff --staged --quiet; then
            echo "Sin cambios, no se hace commit."
          else
            git commit -m "Regenerar catálogo automáticamente"
            git push
          fi
